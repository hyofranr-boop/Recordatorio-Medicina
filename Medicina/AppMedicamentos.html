<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Medicamentos</title>
    <!-- Enlace CDN de Bootstrap CSS -->
    <link href="cdn.jsdelivr.net" rel="stylesheet" crossorigin="anonymous">
    <!-- Enlace a tu CSS personalizado -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Fuente de Google Icons -->
    <link href="fonts.googleapis.com" rel="stylesheet">
</head>
<body class="bg-light app-background">

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div id="app-section" class="card shadow-lg border-0 rounded-4 custom-card">
                    <div class="card-header bg-medical-green text-white rounded-top-4">
                        <h1 class="card-title h3 mb-0">💊 Tus Medicamentos</h1>
                    </div>
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-light rounded-3">
                            <h2 class="h5 mb-0">Hola, <span id="welcome-user" class="text-medical-green fw-bold"></span>! 👋</h2>
                            <button onclick="logout()" class="btn btn-sm btn-outline-danger">Cerrar Sesión</button>
                        </div>

                        <h3 class="h6 mt-4 mb-2 text-muted">Añadir Nuevo Medicamento</h3>
                        <div class="input-group mb-3">
                            <input type="text" id="med-name" class="form-control" placeholder="Nombre del medicamento">
                            <input type="time" id="med-time" class="form-control" value="09:00">
                            <button onclick="addMedication()" class="btn btn-medical-green">
                                <span class="material-icons">add</span>
                            </button>
                        </div>

                        <h3 class="h6 mt-4 mb-2 text-muted">Tus Medicamentos</h3>
                        <ul id="medication-list" class="list-group">
                            <!-- Los medicamentos se listarán aquí dinámicamente -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Bootstrap JS -->
    <script src="cdn.jsdelivr.net" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
