<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Recordatorio</title>
    <!-- Enlace CDN de Bootstrap CSS -->
    <link href="cdn.jsdelivr.net" rel="stylesheet" crossorigin="anonymous">
    <!-- Enlace a tu CSS personalizado -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-medical-green text-white rounded-top-4">
                        <h1 class="card-title h3 mb-0">🔑 Iniciar Sesión</h1>
                    </div>
                    <div class="card-body p-4">
                        <p>Ingresa con tu usuario existente.</p>
                        <div id="login-section">
                            <div class="mb-3">
                                <label for="login-username" class="form-label">Usuario:</label>
                                <input type="text" id="login-username" class="form-control form-control-lg" placeholder="Ingresa tu usuario">
                            </div>
                            <button onclick="loginUser()" class="btn btn-success w-100 btn-lg shadow-sm">Iniciar Sesión</button>
                            <p class="mt-3 text-center">¿No tienes cuenta? <a href="registrarse.html">Regístrate aquí</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Script de Bootstrap JS -->
    <script src="cdn.jsdelivr.net" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
